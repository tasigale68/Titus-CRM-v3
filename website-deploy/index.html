    <h1>Titus CRM: AI-Powered CRM for Australian NDIS, Aged Care and Community Service Providers</h1>
    <p><small>Last updated: 23 March 2026</small></p>

    <h2>What is Titus CRM?</h2>
    <p>Titus CRM is an AI-powered provider management platform built specifically for Australian NDIS, aged care, and community service providers. The platform consolidates five separate business tools into one system: customer relationship management (CRM), staff rostering with SCHADS Award compliance, human resources management, recruitment with an applicant tracking system, and a quality management system with 18 built-in compliance registers. Titus CRM includes a 24/7 AI agent named Denise that handles after-hours calls, shift reminders, and policy queries. The platform generates AI-powered NDIS progress reports, stakeholder updates, and incident reports using voice-to-text input. Pricing starts at $249 per week plus GST with no per-user charges, and all data is hosted in Australia. The platform is used by NDIS providers including Delta Community Support in Brisbane, Amaiya Support in Melbourne, and Meadow Street in Melbourne.</p>

    <h2>What problem does Titus CRM solve for NDIS providers?</h2>
    <p>Admin-heavy disability service providers spend 10 or more hours every week on paperwork that could be automated. Report writing alone takes an average of 4 hours per week, followed by chasing timesheets and shift reminders (3 hours), tracking compliance certifications (2 hours), managing service agreements (1 hour), and handling after-hours calls. Most providers use between 3 and 5 separate software tools that do not communicate with each other, creating duplicate data entry and compliance gaps. Titus CRM automates these tasks through AI report writing, automated shift reminders, colour-coded certification expiry tracking, digital service agreements with auto-reminders, and a 24/7 AI voice agent. Providers using the platform report saving $64,000 or more per year in administrative costs and reclaiming 10+ hours every week.</p>

    <h2>What features does Titus CRM include?</h2>
    <ul>
      <li><strong>18 QMS Compliance Registers</strong>: incidents, complaints, risks, medications, worker screening, consent, feedback, training, restrictive practices, behaviour support plans, continuous improvement, service agreements, audit logs, emergency management, and progress notes. All registers are automatically populated from daily platform usage.</li>
      <li><strong>NDIS Auditor AI</strong>: continuous compliance scanning across all 18 registers, generating audit-readiness scores and flagging gaps before audits occur.</li>
      <li><strong>SCHADS-Compliant Rostering</strong>: drag-and-drop scheduling with real-time budget tracking, automatic penalty rate calculation (Saturday x1.5, Sunday x2.0, public holiday x2.5), overtime triggers, sleepover allowances, and broken shift detection.</li>
      <li><strong>Full HR and Recruitment ATS</strong>: Kanban recruitment pipeline, AI-powered CV extraction, compliance certification tracking with colour-coded expiry badges, digital document signing, and contractor ABN validation.</li>
      <li><strong>24/7 AI Voice Agent (Denise)</strong>: always-on AI receptionist handling calls, shift enquiries, sick leave, message taking, and urgent routing. Available as an add-on for $69.95/week +GST.</li>
      <li><strong>Browser Softphone</strong>: inbound and outbound calls, call recording with transcripts, and SMS messaging directly from the browser.</li>
      <li><strong>AI Report Writing</strong>: generates progress notes, incident reports, and stakeholder summaries from participant data in seconds.</li>
      <li><strong>Voice-to-Text Notes</strong>: dictate progress notes and incident reports on mobile, auto-saved to participant records.</li>
      <li><strong>Digital Service Agreements</strong>: create, send, and track NDIS service agreements with automated plan expiry reminders and digital signature capture.</li>
      <li><strong>Client Budget Tracking</strong>: SIL, Community Access, and Transport budgets with live utilisation bars and real-time deductions from rostered shifts.</li>
      <li><strong>Learning Management System</strong>: 21 NDIS-compliant training courses, quizzes, competency tracking, AI-powered course builder, and audit evidence pack generation.</li>
      <li><strong>Worker Mobile Portal</strong>: roster viewing, timesheet submission, availability management, document uploads, and voice-to-text progress notes from any mobile device.</li>
    </ul>

    <h2>How much does Titus CRM cost?</h2>
    <table style="width:100%;border-collapse:collapse;margin:16px 0">
      <thead><tr style="border-bottom:2px solid #9A7B2E">

        <th style="text-align:left;padding:8px">Staff Size</th>
        <th style="text-align:left;padding:8px">Implementation</th>
      </tr></thead>
      <tbody>
        <tr style="border-bottom:1px solid #eee"><td style="padding:8px">Foundation</td><td style="padding:8px">$249 +GST</td><td style="padding:8px">1 to 15 staff</td><td style="padding:8px">Based on business size</td></tr>
        <tr style="border-bottom:1px solid #eee"><td style="padding:8px">Growth</td><td style="padding:8px">$499 +GST</td><td style="padding:8px">10 to 40 staff</td><td style="padding:8px">Based on business size</td></tr>
        <tr><td style="padding:8px">Scale</td><td style="padding:8px">$749 +GST</td><td style="padding:8px">30+ staff</td><td style="padding:8px">Based on business size</td></tr>

    <p>All plans include a 14-day free trial, flat weekly fee with no per-user charges, and cancel-anytime terms. The 24/7 AI Voice Agent (Denise) is available as an add-on to any plan for $69.95/week +GST.</p>

    <h2>What compliance registers do NDIS providers need?</h2>
    <p>Under the NDIS Practice Standards, registered providers must maintain quality management records across multiple areas. Titus CRM includes 18 built-in QMS compliance registers organised across five categories:</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0">
      <thead><tr style="border-bottom:2px solid #9A7B2E">
        <th style="text-align:left;padding:8px">Category</th>
        <th style="text-align:left;padding:8px">Registers</th>
        <th style="text-align:left;padding:8px">Auto-populated</th>
      </tr></thead>
      <tbody>
        <tr style="border-bottom:1px solid #eee"><td style="padding:8px">Governance and Risk</td><td style="padding:8px">Risk Register, Legislative Compliance, Quality Improvement, Internal Audit</td><td style="padding:8px">Manual</td></tr>
        <tr style="border-bottom:1px solid #eee"><td style="padding:8px">Incidents and Safety</td><td style="padding:8px">Incident Register, Reportable Incidents (NDIS Commission), CAPA Register, Restrictive Practices</td><td style="padding:8px">Incidents and Reportable auto-populated from incident reports</td></tr>
        <tr style="border-bottom:1px solid #eee"><td style="padding:8px">Complaints and Feedback</td><td style="padding:8px">Complaints Register, Compliments Register</td><td style="padding:8px">Manual</td></tr>
        <tr style="border-bottom:1px solid #eee"><td style="padding:8px">Workforce and Screening</td><td style="padding:8px">Worker Screening, Staff Training, Staff Qualifications, Key Personnel</td><td style="padding:8px">Worker Screening, Training, and Key Personnel auto-populated</td></tr>
        <tr><td style="padding:8px">Participant Records</td><td style="padding:8px">Participant Files, Service Agreements, Consent Register, Medication Administration</td><td style="padding:8px">Service Agreements auto-populated from signed agreements</td></tr>
      </tbody>
    </table>
    <p>Six of the 18 registers are automatically populated from day-to-day operational data (incident reports, certifications, LMS course completions, staff records, and signed service agreements). The remaining 12 support manual entry with guided forms. The NDIS Auditor AI continuously scans all 18 registers to flag compliance gaps and generate audit-readiness scores before external audits.</p>

    <h2>What is SCHADS Award compliant rostering?</h2>
    <p>The Social, Community, Home Care and Disability Services Industry Award (SCHADS) governs pay rates and conditions for disability support workers in Australia. Titus CRM's rostering module automatically calculates SCHADS-compliant pay rates for every shift, including ordinary hours, Saturday loadings (x1.5), Sunday loadings (x2.0), public holiday rates (x2.5), overtime triggers, sleepover allowances, and broken shift payments. The system flags non-compliant rosters before they are published and tracks real-time labour costs against client NDIS budgets.</p>

    <h2>Which industries does Titus CRM serve?</h2>
    <p>Titus CRM is customised for NDIS registered and unregistered providers, aged care organisations, youth services, community services, recruitment agencies, and labour hire companies across Australia and New Zealand. The platform is designed for any admin-heavy service industry that manages staff rosters, client relationships, compliance obligations, and reporting requirements.</p>

function DemoForm({onSubmit}){
  const[form,setForm]=React.useState({firstName:'',lastName:'',email:'',phone:'',state:'',businessType:'',businessDesc:''});
  const[errors,setErrors]=React.useState({});
  const[submitting,setSubmitting]=React.useState(false);
  const update=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const validate=()=>{
    const e={};
    if(!form.firstName.trim())e.firstName='Required';
    if(!form.lastName.trim())e.lastName='Required';
    if(!form.email.match(/^[^@]+@[^@]+\.[^@]+$/))e.email='Valid email required';
    if(!form.phone.trim())e.phone='Required';
    if(!form.state)e.state='Required';
    if(!form.businessType)e.businessType='Required';
    return e;
  };
  const handleSubmit=e=>{
    e.preventDefault();
    const v=validate();
    if(Object.keys(v).length){setErrors(v);return;}
    setSubmitting(true);
    setTimeout(()=>{setSubmitting(false);onSubmit();},1200);
  };
  const inp={width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid #e0e0e0',fontFamily:"'Plus Jakarta Sans',sans-serif",fontSize:14,boxSizing:'border-box',outline:'none'};
  const lbl={fontFamily:"'Plus Jakarta Sans',sans-serif",fontSize:12,fontWeight:700,color:'#444',display:'block',marginBottom:4};
  const err={fontFamily:"'Plus Jakarta Sans',sans-serif",fontSize:11,color:'#e53e3e',marginTop:2};
  return(<form onSubmit={handleSubmit} style={{padding:'0 32px 32px'}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
      <div><label style={lbl}>First Name *</label><input style={{...inp,borderColor:errors.firstName?'#e53e3e':'#e0e0e0'}} value={form.firstName} onChange={update('firstName')} placeholder="e.g. Sarah"/>{errors.firstName&&<p style={err}>{errors.firstName}</p>}</div>
      <div><label style={lbl}>Last Name *</label><input style={{...inp,borderColor:errors.lastName?'#e53e3e':'#e0e0e0'}} value={form.lastName} onChange={update('lastName')} placeholder="e.g. Johnson"/>{errors.lastName&&<p style={err}>{errors.lastName}</p>}</div>
    </div>
    <div style={{marginBottom:12}}><label style={lbl}>Email Address *</label><input type="email" style={{...inp,borderColor:errors.email?'#e53e3e':'#e0e0e0'}} value={form.email} onChange={update('email')} placeholder="e.g. sarah@yourcompany.com.au"/>{errors.email&&<p style={err}>{errors.email}</p>}</div>
    <div style={{marginBottom:12}}><label style={lbl}>Phone Number *</label><input type="tel" style={{...inp,borderColor:errors.phone?'#e53e3e':'#e0e0e0'}} value={form.phone} onChange={update('phone')} placeholder="e.g. 0412 345 678"/>{errors.phone&&<p style={err}>{errors.phone}</p>}</div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
      <div><label style={lbl}>State *</label><select style={{...inp,borderColor:errors.state?'#e53e3e':'#e0e0e0'}} value={form.state} onChange={update('state')}><option value="">Select state...</option>{REGIONS.map(s=><option key={s} value={s}>{s}</option>)}</select>{errors.state&&<p style={err}>{errors.state}</p>}</div>
      <div><label style={lbl}>Type of Business *</label><select style={{...inp,borderColor:errors.businessType?'#e53e3e':'#e0e0e0'}} value={form.businessType} onChange={update('businessType')}><option value="">Select type...</option>{BUSINESS_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select>{errors.businessType&&<p style={err}>{errors.businessType}</p>}</div>
    </div>
    <div style={{marginBottom:20}}><label style={lbl}>Tell us about your business</label><textarea style={{...inp,minHeight:80,resize:'vertical'}} value={form.businessDesc} onChange={update('businessDesc')} placeholder="Briefly describe your business, number of clients, key challenges..."/></div>
